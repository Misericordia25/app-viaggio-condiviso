service cloud.firestore {
  match /databases/{db}/documents {
    function signed() { return request.auth != null; }
    function member(g) { return signed() && request.auth.uid in get(/databases/$(db)/documents/gruppi/$(g)).data.membri; }
    match /users/{uid} {
      allow read: if signed();
      allow write: if signed() && request.auth.uid == uid;
    }
    match /gruppi/{g} {
      allow get: if signed();
      allow create: if signed() && request.resource.data.membri == [request.auth.uid];
      allow update: if member(g) || (signed()
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['membri'])
        && request.resource.data.membri.size() == resource.data.membri.size() + 1
        && request.resource.data.membri.hasAll(resource.data.membri)
        && request.auth.uid in request.resource.data.membri
        && request.resource.data.membri.size() <= 5);
      allow delete: if false;
      match /{sub=**} { allow read, write: if member(g); }
    }
  }
}`;

const S={user:null,me:null,group:null,gid:null,lg:null,members:{},trips:[],log:[],trip:null,tab:LS.g('tab','viaggio'),hist:'viaggi',per:'30',pax:null,fl:{},un:[],gun:[],pending:false,screen:'',resumed:false};
let auth=null,db=null;
const G=()=>db.collection('gruppi').doc(S.gid);
const main=h=>{$('#main').innerHTML=h};
function toast(m,ms=2800){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),ms)}
function modal(title,html,onOpen){$('#mTitle').textContent=title;$('#mBody').innerHTML=html;$('#modal').classList.remove('hidden');$('.sheet').scrollTop=0;onOpen&&onOpen($('#mBody'))}

function applyTheme(){const m=LS.g('theme','auto');const d=m==='dark'||(m==='auto'&&!!window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}
function shell(app,out){$('#tabs').classList.toggle('hidden',!app);$('#bSet').classList.toggle('hidden',!app);$('#bOut').classList.toggle('hidden',!(app||out));$('#hdSub').textContent=app&&S.group?S.group.nome+' · '+(S.me?.nome||''):'';document.body.style.paddingBottom=app?'':'20px'}
function updNet(){const d=$('#net');if(!d)return;const on=navigator.onLine;d.className='dot '+(on?(S.pending?'pend':'on'):'');d.title=on?(S.pending?t('netPend'):t('netOn')):t('netOff')}
const mem=()=>(S.group?.membri||[]).map(u=>({uid:u,...(S.members[u]||{nome:'—'})}));
const nameOf=u=>S.members[u]?.nome||(u===S.user?.uid?S.me?.nome:'')||'—';
const myName=()=>S.me?.nome||'';
const colOf=u=>COLS[Math.max(0,(S.group?.membri||[]).indexOf(u))%5];
const vehLabel=v=>{v=v||{};const s=[v.marca,v.modello].filter(Boolean).join(' ')+(v.targa?' · '+v.targa:'');return s||'—'};
let RQ=0;
function renderAll(){if(RQ)return;RQ=requestAnimationFrame(()=>{RQ=0;if(!S.user||!S.me||!S.me.gruppoId)return;S.screen='app';shell(true);
 if(!S.group){main(`<div class="card c">${t('loading')}</div>`);return}
 $$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));(S.tab==='equip'?rEquip:S.tab==='storico'?rStorico:rViaggio)();updNet()})}

function log(tipo,azione,esito='',det=''){const r={data:Date.now(),uid:auth?.currentUser?.uid||'',nome:myName(),tipo,azione,esito,det:String(det||''),dev:DEV};
 if(S.gid&&db&&S.user)G().collection('registro').add(r).catch(()=>{});
 else{const q=LS.g('logq',[]);q.push(r);LS.s('logq',q.slice(-200));S.log.unshift(r)}}
function flushLogQ(){const q=LS.g('logq',[]);if(!q.length||!S.gid||!S.user)return;LS.d('logq');q.forEach(r=>{r.uid=r.uid||S.user.uid;r.nome=r.nome||myName();G().collection('registro').add(r).catch(()=>{})})}

/* ---- 6. AVVIO, CLOUD E ACCESSO ---- */
function boot(){applyTheme();i18n();bindStatic();updNet();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 if(typeof firebase==='undefined'){shell(false);main(`<div class=card>⚠️ ${t('noFb')}</div>`);return}
 const cfg=FB_CONFIG||LS.g('fbcfg',null);if(!cfg)return showSetup();
 try{firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(e=>console.warn('persistence',e.code))}catch(e){toast(e.message);return showSetup()}
 auth.onAuthStateChanged(u=>{stopUser();if(u){S.user=u;loadCache(u.uid);startUser()}else{Object.assign(S,{user:null,me:null,group:null,gid:null,lg:null,members:{},trips:[],log:[],trip:null,resumed:false,pax:null,fl:{},hist:'viaggi'});showLogin()}})}
function bindStatic(){$('#bInfo').onclick=showInfo;$('#bSet').onclick=showSettings;$('#bOut').onclick=logout;$('#mClose').onclick=closeM;$('#modal').onclick=e=>{if(e.target.id==='modal')closeM()};
 $$('#tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;LS.s('tab',S.tab);scrollTo(0,0);renderAll()});
 document.addEventListener('visibilitychange',()=>{const T=S.trip;if(!T||T.stopped)return;if(document.hidden)log('viaggio','App in secondo piano','avviso','il sistema può sospendere il GPS');else wakeOn(true)});
 addEventListener('online',()=>{updNet();if(S.user)log('sync','Connessione disponibile','ok')});
 addEventListener('offline',()=>{updNet();if(S.user)log('sync','Connessione assente','avviso','dati salvati in locale')});
 if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme)}
function stopUser(){S.un.forEach(f=>f());S.un=[];S.gun.forEach(f=>f());S.gun=[]}
function saveCache(){clearTimeout(saveCache.t);saveCache.t=setTimeout(()=>{if(S.user)LS.s('cache_'+S.user.uid,{me:S.me,group:S.group,members:S.members,trips:S.trips.slice(0,500).map(({traccia,...r})=>r),log:S.log.slice(0,300)})},800)}
function loadCache(uid){const c=LS.g('cache_'+uid,null);if(!c)return;Object.assign(S,{me:c.me,group:c.group,members:c.members||{},trips:c.trips||[],log:c.log||[]});if(S.group)S.gid=S.group.id;renderAll()}
function startUser(){const uid=S.user.uid;
 S.un.push(db.collection('users').doc(uid).onSnapshot(d=>{S.me=d.exists?d.data():null;
  if(!S.me||!S.me.gruppoId){if(d.metadata.fromCache&&!d.exists&&navigator.onLine)return;if(S.screen!=='onboard')showOnboard();return}
  if(S.lg!==S.me.gruppoId)listenGroup(S.me.gruppoId);saveCache();renderAll()},e=>toast(e.message)))}
function listenGroup(gid){S.gun.forEach(f=>f());S.gun=[];if(S.group&&S.group.id!==gid){S.group=null;S.trips=[];S.log=[]}S.lg=S.gid=gid;
 const g=G(),er=e=>{console.warn(e);if(e.code==='permission-denied')toast('⛔ '+e.message,5000)};
 S.gun.push(g.onSnapshot(d=>{S.group=d.exists?{id:d.id,...d.data()}:null;flushLogQ();resumeCheck();saveCache();renderAll()},er));
 S.gun.push(db.collection('users').where('gruppoId','==',gid).onSnapshot(q=>{q.forEach(d=>{S.members[d.id]=d.data()});saveCache();renderAll()},er));
 S.gun.push(g.collection('viaggi').orderBy('inizio','desc').limit(3000).onSnapshot({includeMetadataChanges:true},q=>{S.trips=q.docs.map(d=>({id:d.id,...d.data()}));S.pending=q.metadata.hasPendingWrites;updNet();saveCache();renderAll()},er));
 S.gun.push(g.collection('registro').orderBy('data','desc').limit(800).onSnapshot(q=>{S.log=q.docs.map(d=>({id:d.id,...d.data()}));saveCache();if(S.tab==='storico'&&S.hist==='registro')renderAll()},er))}

function showSetup(){S.screen='setup';shell(false);
 main(`<div class=card><h2>☁️ ${t('setupT')}</h2><ol class=steps>${t('setupSteps')}</ol><div class=row><button class=btn id=cpR>📋 ${t('copyRules')}</button></div>

 $('#cpR').onclick=()=>copyTxt(RULES);$('#cfgOk').onclick=()=>{const c=parseCfg($('#cfg').value);if(!c)return toast(t('cfgErr'));LS.s('fbcfg',c);location.reload()}}
function parseCfg(s){const o={};String(s).replace(/["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g,(m,k,v)=>{o[k]=v});return o.apiKey&&o.projectId?o:null}

const em=u=>u.trim().toLowerCase()+'@'+DOM; // il nome utente diventa un'email tecnica per Firebase Auth

 main(`<div class="card auth"><div class=hero>🚗</div><h2>${t('app')}</h2><p class=mu>${t('tagline')}</p>

 $('#uGo').onclick=async()=>{const u=$('#uU').value.trim(),p=$('#uP').value,n=$('#uN').value.trim();if(!/^[A-Za-z0-9._-]{3,30}$/.test(u))return toast(t('errUser'));if(p.length<6)return toast(t('errWeak'));

   else{await auth.signInWithEmailAndPassword(em(u),p);log('accesso','Login','ok',u)}}
  catch(e){log('accesso',reg?'Registrazione':'Login','negato',u+' · '+(e.code||''));toast(errMsg(e))}finally{if(b.isConnected)b.disabled=false}}}

/* ---- 8. CALCOLO CONSUMI ----
   Per tipo di strada: consumo dichiarato × correzione per velocità media del tratto
   (sopra 110 km/h cresce, nel lento/coda cresce) × correzione per guida brusca. */
function fuel(v,km,tm,ev,tot,g){v=v||{};const al=v.al||'benzina',d=DEFV[al]||DEFV.benzina,cu=+v.cu||d.cu,ce=+v.ce||d.ce,ca=+v.ca||d.ca;
 const base={a:ca,s:ce,p:ce*.75+cu*.25,u:cu};let q=0;
 ROADS.forEach(k=>{const K=km[k]||0;if(!K)return;const h=(tm[k]||0)/3600,sp=h>0?K/h:0;let f=1;
  if(sp>110)f+=(sp-110)*(al==='elettrico'?.016:.012);if(k!=='u'&&sp>0&&sp<35)f+=.1;if(k==='u'&&sp>0&&sp<18)f+=.15;q+=K*base[k]*f/100});
 const per10=tot>0?ev/tot*10:0,idx=Math.max(0,Math.round(100-per10*12));q*=1+Math.min(.15,per10*.03);
 const pk=PKEY[al]||'benzina',pr=+((g?.prezzi||{})[pk]??DEFP[pk]);return{q:r2(q),u:UNIT[al]||'l',pr,costo:r2(q*pr),idx}}

/* ---- 9. MOTORE VIAGGIO (tassametro) ---- */
const kmObj=T=>({a:T.km.a/1000,s:T.km.s/1000,p:T.km.p/1000,u:T.km.u/1000});
const rollAvg=T=>T.roll.length?T.roll.reduce((a,r)=>a+r[1],0)/T.roll.length:0;
const saveActive=()=>{if(S.trip)LS.s('act_'+S.trip.autista,S.trip)};
function newTrip(){return{id:'v'+uid8(),autista:S.user.uid,passeggeri:(S.pax||[]).slice(),inizio:Date.now(),dist:0,km:{a:0,s:0,p:0,u:0},tm:{a:0,s:0,p:0,u:0},vmax:0,cls:'u',pend:null,pc:0,hw:[],hwCur:null,pts:[],lastPt:0,lastCls:-1e9,roll:[],ev:0,gaps:0,last:null,p0:null,osm:0,veh:{...(S.me.veicolo||{al:'benzina'})}}}
async function startTrip(){if(S.trip)return;if(!('geolocation' in navigator))return toast(t('noGps'));
 S.trip=newTrip();const sp=sensorsOn(false);gpsOn();renderAll();await sp;wakeOn();saveActive();startTick();

/* Permessi sensori: su iOS vanno chiesti dentro il tocco su VIA */
async function sensorsOn(resume){const DM=window.DeviceMotionEvent,DO=window.DeviceOrientationEvent;
 const ask=E=>!E?Promise.resolve('na'):E.requestPermission?(resume?Promise.resolve('skip'):E.requestPermission().catch(()=>'denied')):Promise.resolve('granted');
 const [a,b]=await Promise.all([ask(DM),ask(DO)]),es=x=>x==='granted'?'concesso':x==='na'?'non disponibile':x==='skip'?'non richiesto (ripresa)':'negato';
 log('permesso','Accelerometro (DeviceMotion)',es(a));log('permesso','Bussola (DeviceOrientation)',es(b));
 S.cal={n:0,sum:0,bias:0,t0:Date.now()};S.am=0;S.hd=null;
 if(a==='granted')addEventListener('devicemotion',onMotion);else if(a!=='skip')toast(t('motionDenied'));
 if(b==='granted'){addEventListener('deviceorientationabsolute',onOri);addEventListener('deviceorientation',onOri)}}
function sensorsOff(){if(S.wid!=null)navigator.geolocation.clearWatch(S.wid);S.wid=null;removeEventListener('devicemotion',onMotion);removeEventListener('deviceorientationabsolute',onOri);removeEventListener('deviceorientation',onOri);try{S.wl&&S.wl.release()}catch(e){}S.wl=null;clearInterval(S.ti);S.ti=null}
/* Accelerometro: calibrazione a zero nei primi 2,5 s, lettura stabilizzata (media mobile), evento brusco > 3 m/s² */
function onMotion(e){const T=S.trip;if(!T||T.stopped)return;const a=e.acceleration;let m;
 if(a&&a.x!=null)m=Math.hypot(a.x,a.y,a.z);else{const g=e.accelerationIncludingGravity;if(!g||g.x==null)return;m=Math.abs(Math.hypot(g.x,g.y,g.z)-9.81)}
 const c=S.cal;if(Date.now()-c.t0<2500){c.n++;c.sum+=m;c.bias=c.sum/c.n;return}
 S.am=S.am*.8+Math.max(0,m-c.bias)*.2;const now=Date.now();if(S.am>3&&now-(S.lastEv||0)>3000&&(S.v||0)>10){T.ev++;S.lastEv=now}}
/* Bussola: solo letture assolute (iOS webkitCompassHeading / Android deviceorientationabsolute), media circolare */
function onOri(e){let h=null;if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;else if(e.absolute&&e.alpha!=null)h=(360-e.alpha)%360;if(h==null)return;
 if(S.hd==null)S.hd=h;else{const d=((h-S.hd+540)%360)-180;S.hd=(S.hd+d*.15+360)%360}}
function gpsOn(){let first=true;S.wid=navigator.geolocation.watchPosition(p=>{if(first){first=false;log('permesso','GPS (posizione)','concesso','±'+Math.round(p.coords.accuracy)+' m')}onPos(p)},
 e=>{if(e.code===1){log('permesso','GPS (posizione)','negato',e.message);toast(t('gpsDenied'),6000)}else if(e.code===3&&!S.toW){S.toW=1;log('permesso','GPS (posizione)','avviso','timeout')}},{enableHighAccuracy:true,maximumAge:0,timeout:30000})}
async function wakeOn(quiet){if(!('wakeLock' in navigator)){if(!quiet)log('permesso','Schermo sempre acceso','non disponibile');return}
 try{S.wl=await navigator.wakeLock.request('screen');if(!quiet)log('permesso','Schermo sempre acceso','concesso')}catch(e){log('permesso','Schermo sempre acceso','negato',e.message)}}
/* Ogni punto GPS: filtro precisione (≤35 m), scarto salti anomali, stima delle interruzioni, km per tipo di strada */
function onPos(p){const T=S.trip;if(!T||T.stopped)return;const c=p.coords,la=c.latitude,lo=c.longitude,tt=p.timestamp||Date.now();S.acc=c.accuracy;
 if(c.heading!=null&&!isNaN(c.heading)&&(c.speed||0)>3)S.gh=c.heading;
 if(c.accuracy>35)return;
 if(!T.last){T.last={la,lo,t:tt};T.p0=[r5(la),r5(lo)];T.pts.push(r5(la)+','+r5(lo));return}
 const d=hav(T.last.la,T.last.lo,la,lo),dt=(tt-T.last.t)/1000;if(dt<=0)return;
 const vc=d/dt*3.6;if(vc>230&&dt<20)return;
 const v=(c.speed!=null&&c.speed>=0)?c.speed*3.6:vc;
 if(dt>20&&d>200){const add=Math.min(d*1.2,8e4);T.km[T.cls]+=add;T.tm[T.cls]+=dt;T.dist+=add;T.gaps++;log('viaggio','Interruzione GPS','avviso',`${Math.round(dt)} s · ${nf(add/1000,1)} km stimati in linea retta`)}
 else if(d<Math.max(4,c.accuracy*.5)){T.tm[T.cls]+=dt;T.last.t=tt;S.v=v<3?0:v;return}
 else{T.km[T.cls]+=d;T.tm[T.cls]+=dt;T.dist+=d}
 S.v=v;if(v>T.vmax&&v<230)T.vmax=v;T.roll.push([tt,v]);while(T.roll.length&&tt-T.roll[0][0]>6e4)T.roll.shift();

 if(T.dist-T.lastPt>=150){T.pts.push(r5(la)+','+r5(lo));T.lastPt=T.dist;if(T.pts.length>800)T.pts=T.pts.filter((_,i,a)=>i%2===0||i===a.length-1)}
 if(T.dist-T.lastCls>=300){T.lastCls=T.dist;classify(T,la,lo)}}
/* Tipo di strada: OpenStreetMap (Overpass) se c'è rete, altrimenti stima dalla velocità dell'ultimo minuto */
function hwCls(g){const hw=g.highway||'',ref=(g.ref||'').toUpperCase();if(!hw||/footway|cycleway|path|steps|pedestrian|track|construction|proposed|bus_guideway|corridor|platform|bridleway/.test(hw))return null;
 if(/^motorway/.test(hw)||/^A\s?\d/.test(ref))return 'a';if(/^(trunk|primary)/.test(hw)||/^(SS|SR|SGC|E)\s?\d/.test(ref))return 's';if(/^secondary/.test(hw)||/^SP\s?\d/.test(ref))return 'p';return 'u'}
function classify(T,la,lo){const r=rollAvg(T),h=r>95?'a':r>65?'s':r>40?'p':'u';
 if(!navigator.onLine||S.ovBusy)return vote(T,h);S.ovBusy=true;const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
 const q=`[out:json][timeout:6];way(around:25,${la.toFixed(6)},${lo.toFixed(6)})[highway];out tags;`;
 fetch('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q),{signal:ac.signal}).then(x=>x.json()).then(j=>{const cs=new Set();(j.elements||[]).forEach(w=>{const k=hwCls(w.tags||{});if(k)cs.add(k)});
  let c=h;if(cs.size){if(cs.has('a')&&r>70)c='a';else if(h!=='a'&&cs.has(h))c=h;else c=['s','p','u'].find(x=>cs.has(x))||h}T.osm++;vote(T,c)})
 .catch(()=>vote(T,h)).finally(()=>{clearTimeout(to);S.ovBusy=false})}
/* Isteresi: il cambio di tipo di strada richiede due conferme consecutive */
function vote(T,c){if(!T||T.stopped||S.trip!==T)return;if(c===T.cls){T.pend=null;T.pc=0;return}if(T.pend===c)T.pc++;else{T.pend=c;T.pc=1}if(T.pc>=2){setCls(T,c);T.pend=null;T.pc=0}}
/* Ingresso/uscita autostrada → tratti con punto di entrata e di uscita (per i caselli) */
function setCls(T,c){const prev=T.cls,L0=T.last;T.cls=c;if(!L0)return;const pt=[r5(L0.la),r5(L0.lo)];
 if(c==='a'&&!T.hwCur)T.hwCur={e:pt,k0:T.dist};else if(prev==='a'&&T.hwCur){T.hw.push({e:T.hwCur.e,u:pt,km:r2((T.dist-T.hwCur.k0)/1000)});T.hwCur=null}}
function startTick(){clearInterval(S.ti);S.ti=setInterval(tick,1000)}
const cardDir=h=>t('dirs').split(',')[Math.round(h/45)%8];
function tick(){const T=S.trip;if(!T||T.stopped)return;const e=id=>document.getElementById(id);if(Date.now()-(S.svT||0)>5000){S.svT=Date.now();saveActive()}if(!e('lKm'))return;
 const km=T.dist/1000,ko=kmObj(T),c=fuel(T.veh,ko,T.tm,T.ev,km,S.group),hwk=T.hw.reduce((a,x)=>a+x.km,0)+(T.hwCur?(T.dist-T.hwCur.k0)/1000:0),mv=ROADS.reduce((a,k)=>a+T.tm[k],0);
 e('lKm').textContent=nf(km,2);e('lTm').textContent=fClock((Date.now()-T.inizio)/1000);e('lEu').textContent=nf(c.costo+hwk*(S.group?.tariffaKm||0),2);
 e('lV').textContent=Math.round(S.v||0);e('lVm').textContent=mv?Math.round(km/(mv/3600)):0;
 e('lRd').className='road r'+T.cls;e('lRd').textContent=ROADI[T.cls]+' '+t('r_'+T.cls);
 e('lAcc').textContent=S.acc!=null?'±'+Math.round(S.acc)+' m':'…';e('lAcc').className=S.acc==null?'':S.acc<=15?'ok':S.acc<=35?'wa':'er';
 const h=((S.v||0)>10&&S.gh!=null)?S.gh:S.hd;if(h!=null){e('lArr').style.transform=`rotate(${h-90}deg)`;e('lHd').textContent=Math.round(h)+'° '+cardDir(h)}

 if(T.hwCur&&L0){T.hw.push({e:T.hwCur.e,u:[r5(L0.la),r5(L0.lo)],km:r2((T.dist-T.hwCur.k0)/1000)});T.hwCur=null}
 if(L0)T.pts.push(r5(L0.la)+','+r5(L0.lo));sensorsOff();saveActive();log('viaggio','Fine viaggio','ok',fkm(T.dist/1000));renderAll();finishModal()}

function finishModal(){const T=S.trip,g=S.group;if(!T||!g)return;const cas=g.caselli||{},segs=T.hw.filter(h=>h.km>=1);
 const near=pt=>{let b='new',bd=2500;Object.entries(cas).forEach(([id,c])=>{const d=hav(pt[0],pt[1],c.lat,c.lon);if(d<bd){bd=d;b=id}});return b};

 ${segs.length?`<h3 style="margin-top:12px">🛣️ ${t('tolls')}</h3>`+segs.map((s,i)=>{const E=near(s.e),U=near(s.u);return `<div class="card2 hws" data-k="${i}"><b class=sm>${t('hwSeg')} ${i+1} · ${fkm(s.km)}</b>

  <label>${t('tollAmt')}<input class=fI type=number inputmode=decimal step=0.1></label><p class="sm mu fK"></p></div>`}).join(''):`<p class="mu sm" style="margin:10px 0">🛤️ ${t('noHw')}</p>`}
 <label>${t('note')}<input id=fNote></label>
 <div class=row><button class="btn er" id=fDel>🗑️ ${t('discard')}</button><button class="btn pri" id=fOk>✓ ${t('save')}</button></div>`,b=>{

  $('#fDel').onclick=()=>{if(!confirm(t('confirmDiscard')))return;log('viaggio','Viaggio scartato','ok',fkm(T.dist/1000));LS.d('act_'+T.autista);S.trip=null;closeM();renderAll()};
  $('#fOk').onclick=()=>saveTrip(segs,b)})}
function saveTrip(segs,b){const T=S.trip,g=S.group,odo=num($('#fOdo').value),gk=T.dist/1000;
 const km={},tm={};let tot;
 if(gk>0){const sc=odo>0?odo/gk:1;ROADS.forEach(k=>{km[k]=r2(T.km[k]/1000*sc)});tot=r2(odo>0?odo:gk)}else{ROADS.forEach(k=>{km[k]=0});km[T.cls]=r2(odo);tot=r2(odo)}

function csvLog(list){csvOut(`storico-azioni_${stamp()}.csv`,[['Data','Ora','Utente','Tipo','Azione','Esito','Dettaglio','Dispositivo'],...list.map(x=>[fD(x.data),new Date(x.data).toLocaleTimeString('it-IT'),x.nome,x.tipo,x.azione,x.esito,x.det,x.dev])]);log('dati','Esportazione CSV storico azioni','ok',list.length+' righe')}
function report(){const p=S.per,pl=t(PERS.find(x=>x[0]===p)[1]),tr=fTrips(p),st=stats(tr),g=S.group,rk=[...st.L].sort((a,b)=>b.n-a.n);
 $('#print').innerHTML=`<div class=ph><div><h1>🚗 ${t('app')}</h1><div>${esc(g.nome)}${g.azienda?' · '+esc(g.azienda):''}</div></div><div class=r>${t('period')}: ${pl}<br>${t('generated')} ${fDT(Date.now())}<br>${t('by')} ${esc(myName())}</div></div>
 <h2>${t('balance')}: ${balLab(st)[1]}</h2><p>${st.N} ${t('trips')} · ${fkm(st.K)} · ${t('fairShare')} ${nf(st.avg,1)} ${t('tripsEach')}</p>
 <table><tr><th>${t('driver')}</th><th>${t('trips')}</th><th>${t('dev')}</th><th>km</th><th>${t('share')}</th><th>${t('fuelCost')}</th><th>${t('tolls')}</th><th>${t('total')}</th><th>€/km</th><th>${t('avg')}</th><th>${t('style')}</th></tr>
 ${rk.map(r=>`<tr><td>${esc(r.nome)}</td><td>${r.n}</td><td>${r.dev>0?'+':''}${nf(r.dev,1)}</td><td>${nf(r.km,1)}</td><td>${nf(r.kmPct,0)}%</td><td>${eur(r.carb)}</td><td>${eur(r.ped)}</td><td>${eur(r.costo)}</td><td>${nf(r.eKm,3)}</td><td>${nf(r.vm,0)}</td><td>${r.n?r.idx:'—'}</td></tr>`).join('')}</table>
 <h2>${t('tripList')}</h2><table><tr><th>${t('start')}</th><th>${t('driver')}</th><th>${t('passengers')}</th><th>km</th><th>${t('r_a')} km</th><th>${t('duration')}</th><th>${t('avg')}</th><th>${t('tolls')}</th><th>${t('total')}</th></tr>
 ${tr.map(x=>`<tr><td>${fDT(x.inizio)}</td><td>${esc(nameOf(x.autista))}</td><td>${(x.passeggeri||[]).map(u=>esc(nameOf(u))).join(', ')}</td><td>${nf(x.km?.tot,1)}</td><td>${nf(x.km?.a,1)}</td><td>${fHM(x.durata)}</td><td>${nf(x.velMedia,0)}</td><td>${eur(x.pedaggio)}</td><td>${eur(x.costo)}</td></tr>`).join('')}</table>
 <p class=foot>${t('repFoot')} · ${t('app')} ${VER}</p>`;
 log('dati','Report PDF','ok',pl);toast(t('pdfHint'));setTimeout(()=>print(),400)}
function exportJSON(){dl(`viaggio-condiviso_backup_${stamp()}.json`,JSON.stringify({app:'viaggio-condiviso',ver:VER,data:Date.now(),gruppo:S.group,membri:S.members,viaggi:S.trips,registro:S.log}),'application/json');log('dati','Backup esportato','ok',S.trips.length+' viaggi')}
function importJSON(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='viaggio-condiviso'||!Array.isArray(d.viaggi))throw 0;if(!confirm(t('impQ')))return;
 const cur=Object.fromEntries(S.trips.map(x=>[x.id,x]));let n=0;d.viaggi.forEach(x=>{const{id,...rest}=x;if(!id)return;const c=cur[id];if(c&&(c.agg||0)>=(rest.agg||0))return;G().collection('viaggi').doc(id).set(rest).catch(()=>{});n++});
 const gd=d.gruppo||{},upd={};Object.entries(gd.caselli||{}).forEach(([k,v])=>{if(!(S.group.caselli||{})[k])upd['caselli.'+k]=v});Object.entries(gd.tratte||{}).forEach(([k,v])=>{if((S.group.tratte||{})[k]==null)upd['tratte.'+k]=v});
 if(Object.keys(upd).length)G().update(upd).catch(()=>{});log('dati','Backup importato','ok',n+' viaggi');toast(t('impOk')+': '+n)}catch(e){toast(t('impErr'))}};r.readAsText(f)}

/* ---- 15. IMPOSTAZIONI ---- */
function showSettings(){if(!S.group)return;const m=S.me||{},g=S.group,p={...DEFP,...(g.prezzi||{})};
 modal(t('settings'),`<div class=card><h3>👤 ${t('profile')} · 🚘 ${t('vehicle')}</h3>${vehForm(m)}</div>
 <div class=card><h3>👥 ${t('sGroup')}</h3><label>${t('grpName')}<input id=sGn value="${esc(g.nome)}"></label><label>${t('company')}<input id=sGa value="${esc(g.azienda||'')}"></label>
 <label>${t('inviteCode')}</label><div class=row style="margin-top:0"><input readonly value="${esc(g.id)}" style="margin:0;font-weight:800;letter-spacing:3px;flex:2"><button class=btn id=sCp>📋 ${t('copy')}</button></div>
 <p class="sm mu" style="margin-top:8px">${t('members')} (${(g.membri||[]).length}/${MAXM}): ${mem().map(x=>esc(x.nome)).join(', ')}</p></div>
 <div class=card><h3>⛽ ${t('sPrices')}</h3><div class=g2>${PF.map(([k,l])=>`<label>${t(l)}<input type=number step=0.001 inputmode=decimal id=pr_${k} value="${p[k]}"></label>`).join('')}<label>${t('tariffa')}<input type=number step=0.001 inputmode=decimal id=sTar value="${g.tariffaKm??.08}"></label></div><p class="sm mu">${t('priceNote')}</p></div>
 <button class="btn pri big" id=sSave>💾 ${t('save')}</button>
 <div class=card style="margin-top:12px"><h3>⚙️ ${t('sApp')}</h3><div class=g2><label>${t('lang')}<select id=sL><option value=it ${LANG==='it'?'selected':''}>Italiano</option><option value=en ${LANG==='en'?'selected':''}>English</option></select></label>
 <label>${t('theme')}<select id=sT>${['auto','light','dark'].map(x=>`<option value=${x} ${LS.g('theme','auto')===x?'selected':''}>${t('th_'+x)}</option>`).join('')}</select></label></div>
 <h3 style="margin-top:10px">💾 ${t('backup')}</h3><div class=row><button class=btn id=bE>⬇️ ${t('bExp')}</button><button class=btn id=bI>⬆️ ${t('bImp')}</button></div><input type=file id=fI accept=".json,application/json" class=hidden>
 <div class=row>${FB_CONFIG?'':`<button class=btn id=bRc>☁️ ${t('resetCfg')}</button>`}<button class="btn er" id=bLv>🚪 ${t('leave')}</button></div>
 <p class="sm mu c" style="margin-top:12px">${t('app')} · ${t('version')} ${VER}</p></div>`,()=>{bindVeh();
  $('#sCp').onclick=()=>copyTxt(g.id);$('#bE').onclick=exportJSON;$('#bI').onclick=()=>$('#fI').click();$('#fI').onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0])};
  $('#sL').onchange=e=>{LANG=e.target.value;LS.s('lang',LANG);i18n();db.collection('users').doc(S.user.uid).set({lingua:LANG},{merge:true}).catch(()=>{});showSettings();renderAll()};
  $('#sT').onchange=e=>{LS.s('theme',e.target.value);applyTheme();renderAll()};
  if($('#bRc'))$('#bRc').onclick=()=>{if(confirm(t('resetCfg')+'?')){LS.d('fbcfg');location.reload()}};
  $('#bLv').onclick=()=>{if(S.trip)return toast(t('tripRun'));if(!confirm(t('confirmLeave')))return;log('dati','Uscita dal gruppo','ok',g.id);
   G().update({membri:firebase.firestore.FieldValue.arrayRemove(S.user.uid)}).catch(()=>{});db.collection('users').doc(S.user.uid).set({gruppoId:null},{merge:true}).catch(()=>{});
   S.gun.forEach(f=>f());S.gun=[];Object.assign(S,{group:null,gid:null,lg:null,trips:[],log:[],pax:null,screen:''});closeM()};
  $('#sSave').onclick=()=>{const pr=readProfile();if(!pr)return;db.collection('users').doc(S.user.uid).set(pr,{merge:true}).catch(e=>log('sync','Salvataggio profilo','errore',e.message));
   const pz={};PF.forEach(([k])=>{pz[k]=num($('#pr_'+k).value)});G().update({nome:$('#sGn').value.trim()||g.nome,azienda:$('#sGa').value.trim(),prezzi:pz,tariffaKm:num($('#sTar').value)}).catch(e=>log('sync','Salvataggio gruppo','errore',e.message));
   log('dati','Impostazioni salvate','ok');toast(t('saveOk'));closeM()}})}

/* ---- 16. INFORMAZIONI ---- */
function infoHtml(){const steps=`<ol class=steps>${t('setupSteps')}</ol><div class=row><button class=btn id=iR>📋 ${t('copyRules')}</button></div>`;
 if(LANG==='en')return `<p><b>Shared Ride</b> is a comparative taximeter for colleagues who commute by rotating cars (2–5 people). It does <b>not</b> split costs: it checks that <b>driving turns are balanced</b> – how many times each person took the car, how many km and at what cost.</p>
 <h3>🧭 Structure</h3><ul><li><b>🚗 Trip</b> – the driver of the day signs in, ticks who is on board and taps <b>GO</b>. The meter shows km, time, estimated cost, speed, road type, GPS accuracy, compass and driving style. <b>END TRIP</b> opens a summary to confirm.</li>
 <li><b>🏆 Crew</b> – balance status, driver ranking, charts, motorway vs main road comparison, PDF report and CSV, filtered by period.</li>
 <li><b>🗂️ History</b> – trip list with route and corrections; <b>Activity log</b> with sign-ins, permissions (GPS, sensors, screen) and sync, filterable and exportable.</li>
 <li><b>⚙️ Settings</b> – profile and vehicle, group and invite code, fuel prices, language, theme, JSON backup. <b>ℹ️</b> this guide, <b>⏻</b> sign out.</li></ul>
 <h3>📏 How it calculates</h3><ul><li><b>Km</b> from GPS (points worse than ±35 m and jumps are discarded; gaps are estimated in straight line +20% and flagged). Odometer km can replace GPS km.</li>
 <li><b>Road type</b> from OpenStreetMap every 300 m when online, otherwise from the last-minute average speed; a change needs two confirmations.</li>
 <li><b>Tolls</b>: motorway entry/exit are detected; the first time you name the toll gates and type the receipt amount, then the route is learned and applied automatically.</li>
 <li><b>Fuel</b>: declared consumption per road type, increased above 110 km/h, in slow traffic and with harsh driving, × group price.</li>
 <li><b>Balance</b>: fair share = trips ÷ members; within ±1 trip = balanced, ±2 = slight imbalance, beyond = rebalance.</li></ul>
 <h3>☁️ Cloud & offline</h3><p>Each person has a username and password (handled by Firebase). Data sync across devices; offline everything keeps working and is sent when the connection returns (yellow dot = pending, green = synced, grey = offline). Last edit wins and conflicts are logged. The running trip is also saved locally and can be resumed.</p>
 <h3>🔒 Permissions & privacy</h3><p>GPS, motion sensors and screen wake are requested only when tapping GO; each request and its result is logged. Routes are personal data visible only to group members; drivers can fix or delete their trips. Signing out removes local data from the device.</p>
 <h3>⚠️ Limits</h3><p>With the screen off or the app in background the browser pauses GPS: keep the app open in the holder. Road type, estimated tolls and consumption are estimates, not tax documents.</p>
 <h3>🛠️ Cloud setup</h3>${steps}<p class="sm mu c" style="margin-top:12px">${t('version')} ${VER}</p>`;
 return `<p><b>Viaggio condiviso</b> è un tassametro comparativo per chi va al lavoro con l'auto a rotazione (da 2 a 5 persone). <b>Non divide i costi</b>: serve a verificare che <b>i turni di guida siano equilibrati</b> – quante volte ciascuno ha preso la macchina, quanti km ha fatto e quanto gli è costato.</p>
 <h3>🧭 Struttura</h3><ul><li><b>🚗 Viaggio</b> – l'autista del giorno entra con il suo account, spunta chi è a bordo e preme <b>VIA</b>. Il tassametro mostra km, tempo, costo stimato, velocità attuale e media, tipo di strada, precisione GPS, bussola e stile di guida. <b>FINE VIAGGIO</b> apre il riepilogo da confermare (km del contachilometri, caselli, pedaggi, note).</li>
 <li><b>🏆 Equipaggio</b> – stato di equilibrio dei turni, chi deve guidare per riequilibrare, classifica autisti, grafici (viaggi, km, mesi), confronto autostrada/statale, report PDF ed export CSV, con filtro per periodo.</li>
 <li><b>🗂️ Storico</b> – elenco viaggi con dettaglio, disegno del percorso, link a Mappe e correzioni; <b>Storico azioni</b> con accessi, permessi (GPS, sensori, schermo acceso), viaggi e sincronizzazione, filtrabile per data e tipo ed esportabile in CSV.</li>
 <li><b>⚙️ Impostazioni</b> – profilo e veicolo, gruppo e codice di invito, prezzi carburante, lingua, tema, backup JSON. <b>ℹ️</b> questa guida, <b>⏻</b> esci.</li></ul>
 <h3>📏 Come calcola</h3><ul><li><b>Km</b>: dal GPS, scartando i punti imprecisi (oltre ±35 m) e i salti anomali. Se il GPS si interrompe (galleria, app in pausa) il tratto mancante è stimato in linea retta +20% e segnalato. A fine viaggio puoi sostituire i km con quelli del contachilometri.</li>
 <li><b>Tipo di strada</b>: con rete, ogni 300 m la posizione è confrontata con le strade di OpenStreetMap (autostrada, statale, provinciale, urbana); senza rete si stima dalla velocità media dell'ultimo minuto. Il cambio di tipo richiede due conferme consecutive.</li>
 <li><b>Pedaggi</b>: ingresso e uscita dall'autostrada sono rilevati dal GPS. La prima volta indichi i caselli e l'importo dello scontrino: l'app impara la tratta e la volta dopo applica l'importo da sola. Le tratte nuove sono stimate con la tariffa €/km delle impostazioni.</li>
 <li><b>Consumi</b>: per ogni tipo di strada si usa il consumo dichiarato del veicolo (urbano / extraurbano / autostrada), aumentato sopra i 110 km/h, nel traffico lento e con guida brusca, moltiplicato per il prezzo impostato dal gruppo.</li>
 <li><b>Stile di guida</b>: l'accelerometro, calibrato a zero nei primi secondi del viaggio, conta frenate e accelerazioni brusche (indice 0–100).</li>
 <li><b>Equilibrio</b>: quota equa = viaggi totali ÷ membri. Scarto entro ±1 viaggio = equilibrato, fino a ±2 = leggero squilibrio, oltre = da riequilibrare. «Tocca a» indica chi ha guidato meno.</li></ul>
 <h3>☁️ Cloud e offline</h3><p>Ognuno ha nome utente e password (gestiti da Firebase, mai salvati in chiaro). I dati del gruppo si sincronizzano su tutti i dispositivi; senza rete l'app continua a funzionare e invia tutto al ritorno della connessione (pallino giallo = in attesa, verde = sincronizzato, grigio = offline). Se due persone modificano lo stesso dato vince l'ultima modifica, annotata nello Storico azioni. Il viaggio in corso è salvato anche sul dispositivo: se l'app si chiude puoi riprenderlo.</p>
 <h3>🔒 Permessi e privacy</h3><p>GPS, sensori di movimento e schermo acceso vengono chiesti solo premendo VIA; ogni richiesta e il suo esito finiscono nello Storico azioni. Se un permesso viene negato l'app lo segnala. I percorsi sono dati personali: li vedono solo i membri del gruppo e ogni autista può correggere o eliminare i propri viaggi. Uscendo dall'account i dati locali del dispositivo vengono rimossi.</p>
 <h3>⚠️ Limiti</h3><p>Con lo schermo spento o l'app in secondo piano il browser sospende il GPS: tieni l'app aperta sul supporto. Tipo di strada, pedaggi stimati e consumi sono stime correggibili, non documenti fiscali.</p>
 <h3>🛠️ Configurazione cloud</h3>${steps}<p class="sm mu c" style="margin-top:12px">${t('version')} ${VER}</p>`}
function showInfo(){modal('ℹ️ '+t('info'),`<div class=info>${infoHtml()}</div>`,()=>{$('#iR').onclick=()=>copyTxt(RULES)})}

boot();
</script>
